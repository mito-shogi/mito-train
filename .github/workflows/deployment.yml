name: Deployment

# Build a GitHub Release from ./models/*.onnx as an archival snapshot of
# the current model weights. The release is a checkpoint for reproducibility
# and traceability; production serving happens elsewhere (Cloudflare R2).
#
# The workflow does NOT re-run training or export from checkpoints. It expects
# ./models/ to already contain the ONNX files (produced by developer via
# scripts/export/export_all.sh + verify_onnx.py). Bundling models/*.onnx as
# an "artifact" upload step (workflow_dispatch input) lets the workflow run
# on GitHub Actions runners without needing the ~28MB-x-N raw PyTorch ckpts.
#
# Trigger:
#   - manual (workflow_dispatch) with version input
#   - push of a tag matching models-v*.*.*
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0). Must match tag on push flow.'
        required: true
        default: 'v0.1.0'
      models_artifact:
        description: 'Name of a previously uploaded artifact containing models/*.onnx (leave empty to require models/ to be present in the checkout).'
        required: false
        default: ''
  push:
    tags:
      - 'models-v*.*.*'

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create GitHub Release

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # tag looks like refs/tags/models-v0.1.0 -> v0.1.0
            v="${GITHUB_REF#refs/tags/models-}"
          else
            v="${{ inputs.version }}"
          fi
          echo "value=${v}" >> "${GITHUB_OUTPUT}"
          echo "[deployment] version=${v}"

      - name: Download prebuilt models artifact
        if: inputs.models_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.models_artifact }}
          path: models/

      - name: Verify ONNX files present
        run: |
          if [[ ! -d models ]] || [[ -z "$(ls models/*.onnx 2>/dev/null)" ]]; then
            echo "::error::No models/*.onnx found. Upload via 'models_artifact' input or ensure models/ is committed." >&2
            exit 1
          fi
          echo "[deployment] found $(ls models/*.onnx | wc -l) ONNX files"
          ls -lh models/*.onnx

      - name: uv sync
        run: uv sync

      - name: Verify ONNX vs source (skips if source ckpts missing)
        run: |
          # verify_onnx.py needs runs/board-*/latest.pt; on a fresh runner those
          # aren't there, so we tolerate the failure and only warn. Real verify
          # happens on the developer's box before triggering this workflow.
          uv run python scripts/export/verify_onnx.py 2>&1 || \
            echo "::warning::verify_onnx.py skipped (source checkpoints not on runner)"

      - name: Build release bundle
        run: ./scripts/export/build_release.sh ${{ steps.version.outputs.value }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.value }}"
          tag="models-${v}"
          # Release notes are generated by build_release.sh -> write_release_notes.py
          # from the MANIFEST, so per-model realistic accuracy is inlined and
          # matches the JSON source of truth.
          notes_file="dist/release-notes-${v}.md"

          # Idempotent re-run: overwrite assets if the tag already has a release.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "[deployment] release ${tag} already exists — updating notes + assets"
            gh release edit "${tag}" --notes-file "${notes_file}"
            gh release upload "${tag}" \
              "dist/models-${v}.tar.gz" \
              "dist/models-${v}-MANIFEST.json" \
              "dist/models-${v}-SHA256SUMS" \
              --clobber
          else
            gh release create "${tag}" \
              --title "Models ${v}" \
              --notes-file "${notes_file}" \
              "dist/models-${v}.tar.gz" \
              "dist/models-${v}-MANIFEST.json" \
              "dist/models-${v}-SHA256SUMS"
          fi
