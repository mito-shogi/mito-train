extends:
  - '@commitlint/config-conventional'
rules:
  type-enum:
    - 2
    - always
    - [build, ui, ci, docs, feat, fix, perf, refactor, revert, format, test, chore]
  subject-case:
    - 2
    - never
    - [start-case, pascal-case, upper-case]
  header-max-length:
    - 2
    - always
    - 96
