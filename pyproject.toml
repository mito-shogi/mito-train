[project]
name = "mito-train"
version = "0.1.0"
description = "Training pipeline for MITO's shogi board / piece / hand OCR models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mito-shogi" }]

dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "albumentations>=1.4",
  "opencv-python-headless>=4.9",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxruntime-tools>=1.7",
  "pillow>=10.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
]
tracking = [
  "wandb>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mito_train"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
