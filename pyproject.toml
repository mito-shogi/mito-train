[project]
name = "mito-train"
version = "0.1.0"
description = "ぴよ将棋OCR 3モデル (board-detector / piece-classifier / hand-classifier) の学習・ONNX出力"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "onnx>=1.22.0",
    "onnxruntime>=1.27.0",
    "onnxscript>=0.7.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
experiment = [
    "wandb>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mito_train"]

[tool.uv]
# キャッシュと .venv が別ファイルシステム (マウントボリューム) なので
# ハードリンク不可 → copy に固定して警告を抑止。
link-mode = "copy"

[dependency-groups]
upload = [
    "datasets>=5.0.0",
    "hf-transfer>=0.1.9",
    "huggingface-hub>=1.22.0",
]
